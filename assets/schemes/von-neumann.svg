<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="e-Ukraine, Inter, Segoe UI, sans-serif" role="img" aria-label="Архітектура фон Неймана">
  <title>Архітектура фон Неймана</title>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6472"/></marker>
  </defs>
  <style>.t{font-size:15px;font-weight:700;fill:#15356B}.s{font-size:11px;fill:#5B6472}</style>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#15356B">Як «думає» комп'ютер</text>

  <!-- Пам'ять -->
  <rect x="250" y="55" width="220" height="62" rx="12" fill="#EAF0FA" stroke="#D9E0EC"/>
  <text class="t" x="360" y="82" text-anchor="middle">Пам'ять</text>
  <text class="s" x="360" y="102" text-anchor="middle">тут лежать програма і дані, поки працюємо</text>

  <!-- Процесор -->
  <rect x="250" y="150" width="220" height="96" rx="12" fill="#FFF1DD" stroke="#F39200" stroke-width="1.5"/>
  <text class="t" x="360" y="176" text-anchor="middle">Процесор (мозок)</text>
  <rect x="268" y="188" width="86" height="44" rx="8" fill="#fff" stroke="#D9E0EC"/>
  <text class="s" x="311" y="208" text-anchor="middle">АЛП —</text><text class="s" x="311" y="222" text-anchor="middle">рахує</text>
  <rect x="366" y="188" width="86" height="44" rx="8" fill="#fff" stroke="#D9E0EC"/>
  <text class="s" x="409" y="208" text-anchor="middle">Керування —</text><text class="s" x="409" y="222" text-anchor="middle">командує</text>

  <!-- Введення -->
  <rect x="40" y="150" width="150" height="62" rx="12" fill="#E7F5EC" stroke="#D9E0EC"/>
  <text class="t" x="115" y="177" text-anchor="middle">Введення</text>
  <text class="s" x="115" y="197" text-anchor="middle">клавіатура, миша</text>

  <!-- Виведення -->
  <rect x="530" y="150" width="150" height="62" rx="12" fill="#E7F5EC" stroke="#D9E0EC"/>
  <text class="t" x="605" y="177" text-anchor="middle">Виведення</text>
  <text class="s" x="605" y="197" text-anchor="middle">екран, динамік</text>

  <!-- Сховище -->
  <rect x="250" y="282" width="220" height="58" rx="12" fill="#EAF0FA" stroke="#D9E0EC"/>
  <text class="t" x="360" y="307" text-anchor="middle">Сховище (диск)</text>
  <text class="s" x="360" y="326" text-anchor="middle">зберігає файли назавжди</text>

  <!-- звʼязки -->
  <g stroke="#5B6472" stroke-width="2" marker-end="url(#a2)" fill="none">
    <line x1="360" y1="117" x2="360" y2="148"/>
    <line x1="190" y1="181" x2="248" y2="190"/>
    <line x1="470" y1="190" x2="528" y2="181"/>
    <line x1="360" y1="246" x2="360" y2="280"/>
  </g>
  <text x="360" y="354" text-anchor="middle" font-size="12" fill="#2E9E5B" font-weight="700">Програма = список зрозумілих процесору команд</text>
</svg>

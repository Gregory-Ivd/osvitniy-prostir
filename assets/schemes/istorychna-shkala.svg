<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" font-family="e-Ukraine, Inter, Segoe UI, sans-serif" role="img" aria-label="Історія цифрових пристроїв">
  <title>Від механіки до штучного інтелекту</title>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#15356B">Історія цифрових пристроїв</text>
  <line x1="40" y1="120" x2="960" y2="120" stroke="#D9E0EC" stroke-width="4"/>
  <g text-anchor="middle">
    <!-- кожна віха: крапка + рік(зверху) + підпис(знизу) -->
    <g><circle cx="70"  cy="120" r="8" fill="#15356B"/><text x="70"  y="96" font-size="13" font-weight="700" fill="#15356B">1830-ті</text><text x="70"  y="150" font-size="12" fill="#3C4858">механічні</text><text x="70" y="165" font-size="12" fill="#3C4858">машини</text></g>
    <g><circle cx="190" cy="120" r="8" fill="#15356B"/><text x="190" y="96" font-size="13" font-weight="700" fill="#15356B">1940-ві</text><text x="190" y="150" font-size="12" fill="#3C4858">лампові</text><text x="190" y="165" font-size="12" fill="#3C4858">ЕОМ</text></g>
    <g><circle cx="320" cy="120" r="9" fill="#F39200"/><text x="320" y="96" font-size="13" font-weight="700" fill="#F39200">1947</text><text x="320" y="150" font-size="12" fill="#3C4858">транзистор</text><text x="320" y="165" font-size="12" fill="#3C4858">(ключ!)</text></g>
    <g><circle cx="440" cy="120" r="8" fill="#15356B"/><text x="440" y="96" font-size="13" font-weight="700" fill="#15356B">1971</text><text x="440" y="150" font-size="12" fill="#3C4858">мікро-</text><text x="440" y="165" font-size="12" fill="#3C4858">процесор</text></g>
    <g><circle cx="560" cy="120" r="8" fill="#15356B"/><text x="560" y="96" font-size="13" font-weight="700" fill="#15356B">1981</text><text x="560" y="150" font-size="12" fill="#3C4858">персональний</text><text x="560" y="165" font-size="12" fill="#3C4858">комп'ютер</text></g>
    <g><circle cx="680" cy="120" r="8" fill="#15356B"/><text x="680" y="96" font-size="13" font-weight="700" fill="#15356B">1991</text><text x="680" y="150" font-size="12" fill="#3C4858">інтернет</text><text x="680" y="165" font-size="12" fill="#3C4858">(веб)</text></g>
    <g><circle cx="800" cy="120" r="8" fill="#15356B"/><text x="800" y="96" font-size="13" font-weight="700" fill="#15356B">2010</text><text x="800" y="150" font-size="12" fill="#3C4858">планшет</text></g>
    <g><circle cx="920" cy="120" r="9" fill="#2E9E5B"/><text x="920" y="96" font-size="13" font-weight="700" fill="#2E9E5B">2020-ті</text><text x="920" y="150" font-size="12" fill="#3C4858">штучний</text><text x="920" y="165" font-size="12" fill="#3C4858">інтелект</text></g>
  </g>
  <text x="500" y="210" text-anchor="middle" font-size="13" fill="#3C4858">Кожен крок — менший, дешевший і потужніший «перемикач». Усе інше — наслідки.</text>
</svg>

<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="e-Ukraine, Inter, Segoe UI, sans-serif" role="img" aria-label="Історія проєкту Освітній простір">
  <title>Від 5 книг до IT-працевлаштування</title>
  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E9E5B"/></marker>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#15356B">«Освітній простір»: від 5 книг — до працевлаштування</text>
  <style>.yr{font-size:13px;font-weight:800;fill:#F39200}.cap{font-size:12px;fill:#3C4858}.st{font-size:14px;font-weight:700;fill:#15356B}</style>

  <!-- 6 етапів-карток -->
  <g>
    <rect x="20"  y="70" width="140" height="92" rx="12" fill="#EAF0FA" stroke="#D9E0EC"/>
    <rect x="186" y="70" width="140" height="92" rx="12" fill="#EAF0FA" stroke="#D9E0EC"/>
    <rect x="352" y="70" width="140" height="92" rx="12" fill="#FFF1DD" stroke="#D9E0EC"/>
    <rect x="518" y="70" width="140" height="92" rx="12" fill="#FFF1DD" stroke="#D9E0EC"/>
    <rect x="684" y="70" width="140" height="92" rx="12" fill="#E7F5EC" stroke="#D9E0EC"/>
    <rect x="850" y="70" width="140" height="92" rx="12" fill="#E7F5EC" stroke="#D9E0EC"/>
  </g>
  <g text-anchor="middle">
    <text class="yr"  x="90"  y="96">до 2014</text><text class="st" x="90"  y="120">5 книг</text><text class="cap" x="90"  y="140">≈ 13 МБ —</text><text class="cap" x="90" y="155">усе дозволене</text>
    <text class="yr"  x="256" y="96">2014 → 2020</text><text class="st" x="256" y="120">планшети</text><text class="cap" x="256" y="140">право на ПК</text><text class="cap" x="256" y="155">в установі</text>
    <text class="yr"  x="422" y="96">2021</text><text class="st" x="422" y="120">Біржа праці</text><text class="cap" x="422" y="140">workprison —</text><text class="cap" x="422" y="155">перша в Україні</text>
    <text class="yr"  x="588" y="96">осінь 2022</text><text class="st" x="588" y="120">курс КГ</text><text class="cap" x="588" y="140">«рівний —</text><text class="cap" x="588" y="155">рівному»</text>
    <text class="yr"  x="754" y="96">2023</text><text class="st" x="754" y="120">12 сертифікатів</text><text class="cap" x="754" y="140">випускники</text><text class="cap" x="754" y="155">курсу</text>
    <text class="yr"  x="920" y="96">далі</text><text class="st" x="920" y="120">4 працевлашт.</text><text class="cap" x="920" y="140">веб, маркетинг,</text><text class="cap" x="920" y="155">контент</text>
  </g>
  <g stroke="#2E9E5B" stroke-width="2.5" marker-end="url(#ap)">
    <line x1="160" y1="116" x2="184" y2="116"/>
    <line x1="326" y1="116" x2="350" y2="116"/>
    <line x1="492" y1="116" x2="516" y2="116"/>
    <line x1="658" y1="116" x2="682" y2="116"/>
    <line x1="824" y1="116" x2="848" y2="116"/>
  </g>
  <text x="500" y="210" text-anchor="middle" font-size="14" fill="#2E9E5B" font-weight="700">Цей курс — наступний крок цього шляху. І твій теж.</text>
  <text x="500" y="234" text-anchor="middle" font-size="12" fill="#3C4858">Базова установа: ДУ «Житомирська установа виконання покарань №8»</text>
</svg>

<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Освітній Простір №8 — Курс цифрової грамотності</title>
  <meta name="description" content="Курс цифрової грамотності пілотного проєкту «Освітній простір» (Житомирська УВП №8): від архітектури пристроїв до штучного інтелекту та працевлаштування.">
  <link rel="icon" href="brand/logo-mark.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15356B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ОП №8">
  <link rel="apple-touch-icon" href="brand/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Меню">☰</button>
    <img class="logo" src="brand/logo.svg" alt="Освітній Простір №8">
    <span class="spacer"></span>
    <span id="userArea" class="user-area"></span>
    <span class="fs-group" role="group" aria-label="Розмір тексту">
      <button class="iconbtn" id="fsDown" title="Менший текст" aria-label="Зменшити текст">А−</button>
      <button class="iconbtn" id="fsUp" title="Більший текст" aria-label="Збільшити текст">А+</button>
    </span>
    <button class="iconbtn" id="themeBtn" title="Світла / темна тема">🌓</button>
    <button class="iconbtn" id="projBtn" title="Режим проєктора">📽</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="progress-wrap">
        <div class="prog-ring-wrap">
          <div class="prog-ring-outer">
            <svg class="prog-ring" viewBox="0 0 40 40" aria-hidden="true">
              <defs>
                <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#2E9E5B"/>
                  <stop offset="100%" stop-color="#F39200"/>
                </linearGradient>
              </defs>
              <circle class="prog-ring-bg" cx="20" cy="20" r="16"/>
              <circle class="prog-ring-fill" id="progressFill" cx="20" cy="20" r="16"/>
            </svg>
            <span class="prog-ring-num" id="progressRingNum">0/13</span>
          </div>
          <div class="progress-label" id="progressLabel">Пройдено</div>
        </div>
      </div>
      <button class="btn primary submit-btn" id="submitBtn" style="display:none">📤 Здати роботу викладачу</button>
      <nav id="nav"><!-- модулі рендеряться через js/app.js --></nav>
    </aside>

    <main class="content" id="content">
      <!-- контент рендериться через js/app.js -->
    </main>
  </div>

  <script src="content/course.js"></script>
  <script src="content/links.js"></script>
  <script src="js/cabinet.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/trainer.js"></script>
  <script src="js/simulators.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>

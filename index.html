<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Освітній Простір №8 — Курс цифрової грамотності</title>
  <meta name="description" content="Курс цифрової грамотності пілотного проєкту «Освітній простір» (Житомирська УВП №8): від архітектури пристроїв до штучного інтелекту та працевлаштування.">
  <link rel="icon" href="brand/logo-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Меню">☰</button>
    <img class="logo" src="brand/logo.svg" alt="Освітній Простір №8">
    <span class="spacer"></span>
    <span id="userArea" class="user-area"></span>
    <span class="fs-group" role="group" aria-label="Розмір тексту">
      <button class="iconbtn" id="fsDown" title="Менший текст" aria-label="Зменшити текст">А−</button>
      <button class="iconbtn" id="fsUp" title="Більший текст" aria-label="Збільшити текст">А+</button>
    </span>
    <button class="iconbtn" id="themeBtn" title="Світла / темна тема">🌓</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="progress-wrap">
        <div class="progress-bar"><i id="progressFill"></i></div>
        <div class="progress-label" id="progressLabel">Пройдено 0 із 13</div>
      </div>
      <nav id="nav"><!-- модулі рендеряться через js/app.js --></nav>
    </aside>

    <main class="content" id="content">
      <!-- контент рендериться через js/app.js -->
    </main>
  </div>

  <script src="content/course.js"></script>
  <script src="content/links.js"></script>
  <script src="js/cabinet.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
